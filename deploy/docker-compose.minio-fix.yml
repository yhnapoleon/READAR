# Local override: minio/minio was removed from Docker Hub (2026-09), so the pinned
# image in docker-compose.yml can no longer be pulled. bitnamilegacy/minio:2025.6.13
# ships the same MinIO build (RELEASE 2025-06-13T11-33-47Z, commit a6c538c5),
# but its mc client lives at /opt/bitnami/minio-client/bin/mc (on PATH), not /usr/bin/mc.
# Usage:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.minio-fix.yml --env-file docker/.env up -d
services:
  minio:
    image: bitnamilegacy/minio:2025.6.13
    entrypoint:
      - /bin/sh
      - -c
      - |
        (
          until (mc alias set localminio http://localhost:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}) do
            echo "Waiting for MinIO to be ready..."
            sleep 1
          done
          mc mb --ignore-existing localminio/$${STORAGE_BUCKET}
          mc cp --recursive /default_icon/ localminio/$${STORAGE_BUCKET}/default_icon/
          mc cp --recursive /official_plugin_icon/ localminio/$${STORAGE_BUCKET}/official_plugin_icon/
          echo "MinIO initialization complete."
        ) &
        exec minio server /data --console-address ":9001"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mc alias set health_check http://localhost:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} && mc ready health_check',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
